<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corpus Christi – Sister Parish Update</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --gold: #c9a84c;
            --gold-light: #dfc87a;
            --wine: #6b2737;
            --wine-dark: #4a1a26;
            --cream: #faf6ee;
            --sand: #f0e8d8;
            --text: #2c2118;
            --text-light: #5a4a3a;
            --divider: #d4c5a9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--cream);
            color: var(--text);
            line-height: 1.7;
        }

        body.ar {
            direction: rtl;
            font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
        }

        /* ── Header ── */
        header {
            background: linear-gradient(135deg, var(--wine-dark) 0%, var(--wine) 100%);
            color: var(--cream);
            text-align: center;
            padding: 2.2rem 1rem 1.8rem;
            border-bottom: 4px solid var(--gold);
        }

        header .cross {
            font-size: 1.6rem;
            color: var(--gold);
            margin-bottom: 0.4rem;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 0.03em;
            margin-bottom: 0.15rem;
        }

        header .subtitle {
            font-size: 1rem;
            color: var(--gold-light);
            margin-top: 0.1rem;
        }

        /* ── Language toggle ── */
        .lang-toggle {
            display: flex;
            justify-content: center;
            gap: 0;
            background: var(--sand);
            border-bottom: 1px solid var(--divider);
        }

        .lang-toggle button {
            font-family: inherit;
            font-size: 0.88rem;
            padding: 0.6rem 2rem;
            border: none;
            background: transparent;
            color: var(--text-light);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            border-bottom: 3px solid transparent;
        }

        .lang-toggle button:hover {
            background: rgba(0,0,0,0.04);
        }

        .lang-toggle button.active {
            color: var(--wine);
            font-weight: 700;
            border-bottom-color: var(--gold);
            background: rgba(255,255,255,0.5);
        }

        /* ── Container ── */
        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* ── Update cards ── */
        .update-card {
            background: #fff;
            border: 1px solid var(--divider);
            border-radius: 6px;
            margin-bottom: 1.5rem;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .card-header {
            background: var(--sand);
            padding: 0.8rem 1.25rem;
            border-bottom: 1px solid var(--divider);
            display: flex;
            align-items: baseline;
            gap: 1rem;
        }

        .card-date {
            font-size: 0.82rem;
            color: var(--text-light);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .card-title {
            font-size: 1.05rem;
            color: var(--wine);
            font-weight: 700;
        }

        .card-body {
            padding: 1.25rem 1.5rem;
        }

        .card-body p {
            margin-bottom: 0.8rem;
        }

        .card-body p:last-child {
            margin-bottom: 0;
        }

        .card-body.arabic-text {
            direction: rtl;
            text-align: right;
            font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
            font-size: 1.08rem;
            line-height: 2;
        }

        .signature {
            margin-top: 1rem;
            font-style: italic;
            color: var(--text-light);
        }

        .arabic-text .signature {
            font-style: normal;
        }

        /* ── Footer ── */
        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-light);
            font-size: 0.8rem;
            border-top: 1px solid var(--divider);
        }

        .card-body img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 0.6rem 0;
            display: block;
        }

        .card-body a[href*="image"], .card-body a[href$=".jpg"],
        .card-body a[href$=".jpeg"], .card-body a[href$=".png"],
        .card-body a[href$=".webp"], .card-body a[href$=".gif"] {
            color: var(--wine);
            text-decoration: underline;
        }

        .no-updates {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-light);
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-light);
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.3rem; }
            header .subtitle { font-size: 0.88rem; }
            .card-body { padding: 1rem; }
            .container { padding: 1rem 0.75rem 3rem; }
            .lang-toggle button { padding: 0.5rem 1.2rem; font-size: 0.82rem; }
            .card-header { flex-direction: column; gap: 0.2rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="cross">☦</div>
    <h1 id="hdr-title">Corpus Christi – Sandwich, MA<br>Sister Parish Update</h1>
    <div class="subtitle" id="hdr-sub">with Church of the Annunciation – Ein Arik – West Bank</div>
</header>

<nav class="lang-toggle" id="lang-toggle">
    <button id="btn-en" class="active" onclick="setLang('en')">English</button>
    <button id="btn-ar" onclick="setLang('ar')">العربية</button>
</nav>

<div class="container" id="updates-container">
    <div class="loading">Loading updates…</div>
</div>

<footer id="footer">
    Corpus Christi – Sandwich, MA · Sister Parish Communications
</footer>

<script>
const UPDATES_DIR = 'updates/';
const MANIFEST = UPDATES_DIR + 'manifest.json';

let currentLang = 'en';
let loadedUpdates = [];  // cache parsed updates

/* ── Language switching ── */
function setLang(lang) {
    currentLang = lang;
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
    document.body.classList.toggle('ar', lang === 'ar');

    // Swap header
    const title = document.getElementById('hdr-title');
    const sub = document.getElementById('hdr-sub');
    const footer = document.getElementById('footer');

    if (lang === 'ar') {
        title.innerHTML = 'كنيسة البشارة – عين عريك – الضفة الغربية<br>تحديثات شراكة الرعية';
        sub.textContent = 'مع كنيسة جسد المسيح – ساندويتش، ماساتشوستس';
        footer.textContent = 'كنيسة البشارة – عين عريك · اتصالات شراكة الرعية';
    } else {
        title.innerHTML = 'Corpus Christi – Sandwich, MA<br>Sister Parish Update';
        sub.textContent = 'with Church of the Annunciation – Ein Arik – West Bank';
        footer.textContent = 'Corpus Christi – Sandwich, MA · Sister Parish Communications';
    }

    renderAll();
}

/* ── Load & parse ── */
async function loadUpdates() {
    const container = document.getElementById('updates-container');

    try {
        const resp = await fetch(MANIFEST);
        if (!resp.ok) throw new Error('Manifest not found');
        const manifest = await resp.json();

        if (!manifest.length) {
            container.innerHTML = '<div class="no-updates">No updates yet.</div>';
            return;
        }

        manifest.sort((a, b) => b.date.localeCompare(a.date));

        for (const entry of manifest) {
            const mdResp = await fetch(UPDATES_DIR + entry.file);
            if (!mdResp.ok) continue;
            const mdText = await mdResp.text();
            const parsed = parseUpdate(mdText);
            if (parsed) loadedUpdates.push(parsed);
        }

        renderAll();

    } catch (e) {
        container.innerHTML = '<div class="no-updates">Updates will appear here once published.</div>';
        console.error(e);
    }
}

function renderAll() {
    const container = document.getElementById('updates-container');
    if (!loadedUpdates.length) {
        container.innerHTML = '<div class="no-updates">No updates yet.</div>';
        return;
    }
    container.innerHTML = loadedUpdates.map(u => renderCard(u)).join('');
}

/* ── Markdown parser ── */
function parseUpdate(mdText) {
    const fmMatch = mdText.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
    if (!fmMatch) return null;

    const frontmatter = {};
    fmMatch[1].split('\n').forEach(line => {
        const [key, ...rest] = line.split(':');
        if (key && rest.length)
            frontmatter[key.trim()] = rest.join(':').trim().replace(/^["']|["']$/g, '');
    });

    const body = fmMatch[2].trim();

    let english = '', arabic = '', signature_en = '', signature_ar = '';

    const arabicMarkers = ['العربي:', 'العربية:', 'ARABIC:', 'Arabic:'];
    let splitIdx = -1, markerLen = 0;
    for (const m of arabicMarkers) {
        const i = body.indexOf(m);
        if (i > -1) { splitIdx = i; markerLen = m.length; break; }
    }

    if (splitIdx > -1) {
        let enPart = body.substring(0, splitIdx).trim();
        let arPart = body.substring(splitIdx + markerLen).trim();

        enPart = enPart.replace(/^(?:PARISH UPDATE.*?\n)?(?:ENGLISH:\n?)/i, '').trim();
        enPart = enPart.replace(/^---\s*$/gm, '').trim();
        arPart = arPart.replace(/^---\s*$/gm, '').trim();

        // Strip privacy/verification flags
        enPart = enPart.replace(/\n?PRIVACY REVIEW REQUIRED:[\s\S]*$/i, '').trim();
        arPart = arPart.replace(/\n?PRIVACY REVIEW REQUIRED:[\s\S]*$/i, '').trim();
        enPart = enPart.replace(/\n?VERIFICATION NEEDED:[\s\S]*$/i, '').trim();
        arPart = arPart.replace(/\n?VERIFICATION NEEDED:[\s\S]*$/i, '').trim();

        // English signature
        const enLines = enPart.split('\n');
        if (enLines.length >= 2) {
            const last = enLines[enLines.length - 1].trim();
            const prev = enLines[enLines.length - 2].trim();
            if (last.match(/church|parish|bethlehem|jerusalem|nativity/i) ||
                prev.match(/^father|^fr\.|^deacon|^sister|^brother|^bishop|^monsignor/i)) {
                signature_en = prev + '\n' + last;
                english = enLines.slice(0, -2).join('\n').trim();
            } else { english = enPart; }
        } else { english = enPart; }

        // Arabic signature
        const arLines = arPart.split('\n');
        if (arLines.length >= 2) {
            const last = arLines[arLines.length - 1].trim();
            const prev = arLines[arLines.length - 2].trim();
            if (last.match(/كنيسة|رعية|بيت لحم|القدس/) ||
                prev.match(/^الأب|^الشماس|^الأخت|^المطران/)) {
                signature_ar = prev + '\n' + last;
                arabic = arLines.slice(0, -2).join('\n').trim();
            } else { arabic = arPart; }
        } else { arabic = arPart; }
    } else {
        english = body.replace(/\n?PRIVACY REVIEW REQUIRED:[\s\S]*$/i, '').trim();
    }

    return {
        title: frontmatter.title || 'Parish Update',
        date: frontmatter.date || '',
        english, arabic, signature_en, signature_ar
    };
}

/* ── Render markdown subset (images, links, paragraphs) ── */
function renderMarkdown(text) {
    // Process line by line
    const lines = text.split('\n');
    let html = '';
    let inParagraph = false;

    for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) {
            if (inParagraph) { html += '</p>'; inParagraph = false; }
            continue;
        }

        // Process inline markdown
        let processed = escapeHtml(trimmed);

        // Images: ![alt](url)
        processed = processed.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, src) => {
            return `<img src="${src}" alt="${alt}" loading="lazy">`;
        });

        // Links: [text](url)
        processed = processed.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, href) => {
            return `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
        });

        // Standalone image URLs (bare URLs ending in image extensions)
        processed = processed.replace(
            /(?<!["\(])https?:\/\/[^\s<>"']+\.(?:jpg|jpeg|png|gif|webp)(?:\?[^\s<>"']*)?/gi,
            url => `<a href="${url}" target="_blank" rel="noopener">📷 View image</a>`
        );

        // Check if line is just an image (no wrapping <p>)
        if (processed.startsWith('<img ')) {
            if (inParagraph) { html += '</p>'; inParagraph = false; }
            html += processed;
        } else {
            if (!inParagraph) { html += '<p>'; inParagraph = true; }
            else { html += '<br>'; }
            html += processed;
        }
    }
    if (inParagraph) html += '</p>';
    return html;
}

/* ── Render ── */
function renderCard(parsed) {
    const dateStr = formatDate(parsed.date);
    const isAr = currentLang === 'ar';

    const content = isAr ? parsed.arabic : parsed.english;
    const sig     = isAr ? parsed.signature_ar : parsed.signature_en;

    if (!content) return '';

    const bodyHtml = renderMarkdown(content);
    const sigHtml  = sig ? '<div class="signature">' + escapeHtml(sig).replace(/\n/g, '<br>') + '</div>' : '';

    return `
    <article class="update-card">
        <div class="card-header">
            <span class="card-date">${dateStr}</span>
            <span class="card-title">${escapeHtml(parsed.title)}</span>
        </div>
        <div class="card-body${isAr ? ' arabic-text' : ''}">
            <p>${bodyHtml}</p>
            ${sigHtml}
        </div>
    </article>`;
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
        const d = new Date(dateStr + 'T00:00:00');
        return d.toLocaleDateString(currentLang === 'ar' ? 'ar-u-nu-latn' : 'en-US',
            { year: 'numeric', month: 'long', day: 'numeric' });
    } catch { return dateStr; }
}

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

loadUpdates();
</script>

</body>
</html>
