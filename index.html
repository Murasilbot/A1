<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parish Updates / تحديثات الرعية</title>
    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #dfc87a;
            --wine: #6b2737;
            --wine-dark: #4a1a26;
            --cream: #faf6ee;
            --sand: #f0e8d8;
            --text: #2c2118;
            --text-light: #5a4a3a;
            --divider: #d4c5a9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--cream);
            color: var(--text);
            line-height: 1.7;
        }

        header {
            background: linear-gradient(135deg, var(--wine-dark) 0%, var(--wine) 100%);
            color: var(--cream);
            text-align: center;
            padding: 2.5rem 1rem 2rem;
            border-bottom: 4px solid var(--gold);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            margin-bottom: 0.2rem;
        }

        header .subtitle {
            font-size: 1.4rem;
            font-family: 'Scheherazade New', 'Traditional Arabic', 'Amiri', serif;
            color: var(--gold-light);
            direction: rtl;
        }

        header .cross {
            font-size: 1.6rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        .update-card {
            background: #fff;
            border: 1px solid var(--divider);
            border-radius: 6px;
            margin-bottom: 2rem;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .update-card .card-header {
            background: var(--sand);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--divider);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .update-card .card-title {
            font-size: 1.15rem;
            color: var(--wine);
            font-weight: 700;
        }

        .update-card .card-date {
            font-size: 0.85rem;
            color: var(--text-light);
            white-space: nowrap;
        }

        .lang-section {
            padding: 1.25rem 1.5rem;
        }

        .lang-section + .lang-section {
            border-top: 1px solid var(--divider);
        }

        .lang-label {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--gold);
            background: var(--wine);
            padding: 0.15rem 0.6rem;
            border-radius: 3px;
            margin-bottom: 0.75rem;
        }

        .lang-section p {
            margin-bottom: 0.8rem;
        }

        .lang-section p:last-child {
            margin-bottom: 0;
        }

        .arabic {
            direction: rtl;
            text-align: right;
            font-family: 'Scheherazade New', 'Traditional Arabic', 'Amiri', 'Noto Naskh Arabic', serif;
            font-size: 1.08rem;
            line-height: 2;
        }

        .arabic .lang-label {
            float: right;
            margin-left: 0;
            margin-right: 0;
        }

        .signature {
            margin-top: 1rem;
            font-style: italic;
            color: var(--text-light);
        }

        .arabic .signature {
            font-style: normal;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-light);
            font-size: 0.8rem;
            border-top: 1px solid var(--divider);
        }

        .no-updates {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-light);
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-light);
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.4rem; }
            header .subtitle { font-size: 1.15rem; }
            .lang-section { padding: 1rem; }
            .container { padding: 1rem 0.75rem 3rem; }
        }

        /* Google Font import for Arabic */
        @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap');
    </style>
</head>
<body>

<header>
    <div class="cross">☦</div>
    <h1>Parish Partnership Updates</h1>
    <div class="subtitle">تحديثات شراكة الرعية</div>
</header>

<div class="container" id="updates-container">
    <div class="loading">Loading updates…</div>
</div>

<footer>
    Parish Partnership Communications · Managed by Murasil (مراسل)
</footer>

<script>
/**
 * Fetches Markdown files from the updates/ directory,
 * parses YAML frontmatter + bilingual content,
 * renders them as update cards.
 *
 * Works on GitHub Pages with no build step — pure client-side.
 * Relies on a manifest file (updates/manifest.json) listing articles,
 * since GitHub Pages doesn't support directory listing.
 */

const UPDATES_DIR = 'updates/';
const MANIFEST = UPDATES_DIR + 'manifest.json';

async function loadUpdates() {
    const container = document.getElementById('updates-container');

    try {
        const resp = await fetch(MANIFEST);
        if (!resp.ok) throw new Error('Manifest not found');
        const manifest = await resp.json();

        if (!manifest.length) {
            container.innerHTML = '<div class="no-updates">No updates yet. Check back soon.</div>';
            return;
        }

        // Sort newest first
        manifest.sort((a, b) => b.date.localeCompare(a.date));

        let html = '';
        for (const entry of manifest) {
            const mdResp = await fetch(UPDATES_DIR + encodeURIComponent(entry.file));
            if (!mdResp.ok) continue;
            const mdText = await mdResp.text();
            const parsed = parseUpdate(mdText);
            if (!parsed) continue;

            html += renderCard(parsed, entry.date);
        }

        container.innerHTML = html || '<div class="no-updates">No updates to display.</div>';

    } catch (e) {
        // Fallback: try fetching known files if manifest doesn't exist
        container.innerHTML = '<div class="no-updates">Updates will appear here once published.</div>';
        console.log('Manifest not found, static fallback.', e);
    }
}

function parseUpdate(mdText) {
    // Strip YAML frontmatter
    const fmMatch = mdText.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
    if (!fmMatch) return null;

    const frontmatter = {};
    fmMatch[1].split('\n').forEach(line => {
        const [key, ...rest] = line.split(':');
        if (key && rest.length) {
            frontmatter[key.trim()] = rest.join(':').trim().replace(/^["']|["']$/g, '');
        }
    });

    const body = fmMatch[2].trim();

    // Split into English and Arabic sections
    // Look for patterns like "ENGLISH:" / "العربي:" or "---" separators
    let english = '';
    let arabic = '';
    let signature_en = '';
    let signature_ar = '';

    // Try to split by the Arabic section marker
    const arabicMarkers = ['العربي:', 'العربية:', 'ARABIC:', 'Arabic:'];
    let splitIdx = -1;
    let markerLen = 0;

    for (const marker of arabicMarkers) {
        const idx = body.indexOf(marker);
        if (idx > -1) {
            splitIdx = idx;
            markerLen = marker.length;
            break;
        }
    }

    if (splitIdx > -1) {
        let enPart = body.substring(0, splitIdx).trim();
        let arPart = body.substring(splitIdx + markerLen).trim();

        // Remove "ENGLISH:" label if present
        enPart = enPart.replace(/^(?:PARISH UPDATE.*?\n)?(?:ENGLISH:\n?)/i, '').trim();
        // Remove leading/trailing --- separators
        enPart = enPart.replace(/^---\s*$/gm, '').trim();
        arPart = arPart.replace(/^---\s*$/gm, '').trim();

        // Strip PRIVACY REVIEW and VERIFICATION sections from public display
        arPart = arPart.replace(/\n?PRIVACY REVIEW REQUIRED:[\s\S]*$/i, '').trim();
        enPart = enPart.replace(/\n?PRIVACY REVIEW REQUIRED:[\s\S]*$/i, '').trim();

        // Extract signatures (last lines that look like a name + location)
        const enLines = enPart.split('\n');
        const arLines = arPart.split('\n');

        // English signature: last 2 lines if they look like name + church
        if (enLines.length >= 2) {
            const last = enLines[enLines.length - 1].trim();
            const prev = enLines[enLines.length - 2].trim();
            if (last.match(/church|parish|bethlehem|jerusalem/i) ||
                prev.match(/^father|^fr\.|^deacon|^sister|^brother|^bishop/i)) {
                signature_en = prev + '\n' + last;
                english = enLines.slice(0, -2).join('\n').trim();
            } else {
                english = enPart;
            }
        } else {
            english = enPart;
        }

        // Arabic signature: last 2 lines
        if (arLines.length >= 2) {
            const last = arLines[arLines.length - 1].trim();
            const prev = arLines[arLines.length - 2].trim();
            if (last.match(/كنيسة|رعية|بيت لحم|القدس/) ||
                prev.match(/^الأب|^الشماس|^الأخت|^المطران/)) {
                signature_ar = prev + '\n' + last;
                arabic = arLines.slice(0, -2).join('\n').trim();
            } else {
                arabic = arPart;
            }
        } else {
            arabic = arPart;
        }
    } else {
        // No clear split — show everything as English
        english = body.replace(/\n?PRIVACY REVIEW REQUIRED:[\s\S]*$/i, '').trim();
    }

    return {
        title: frontmatter.title || 'Parish Update',
        date: frontmatter.date || '',
        english,
        arabic,
        signature_en,
        signature_ar
    };
}

function renderCard(parsed, date) {
    const dateStr = formatDate(date || parsed.date);

    let enHtml = escapeHtml(parsed.english).replace(/\n/g, '</p><p>');
    let arHtml = escapeHtml(parsed.arabic).replace(/\n/g, '</p><p>');
    let sigEn = parsed.signature_en ? '<div class="signature">' + escapeHtml(parsed.signature_en).replace(/\n/g, '<br>') + '</div>' : '';
    let sigAr = parsed.signature_ar ? '<div class="signature">' + escapeHtml(parsed.signature_ar).replace(/\n/g, '<br>') + '</div>' : '';

    return `
    <article class="update-card">
        <div class="card-header">
            <span class="card-title">${escapeHtml(parsed.title)}</span>
            <span class="card-date">${dateStr}</span>
        </div>
        ${parsed.english ? `
        <div class="lang-section">
            <span class="lang-label">English</span>
            <p>${enHtml}</p>
            ${sigEn}
        </div>` : ''}
        ${parsed.arabic ? `
        <div class="lang-section arabic">
            <span class="lang-label">العربية</span>
            <p>${arHtml}</p>
            ${sigAr}
        </div>` : ''}
    </article>`;
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
        const d = new Date(dateStr + 'T00:00:00');
        return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    } catch {
        return dateStr;
    }
}

function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
}

loadUpdates();
</script>

</body>
</html>
